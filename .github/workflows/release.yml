name: Release

# Tag a commit (e.g. git tag v1.1.0 && git push origin v1.1.0) and this
# builds the APK and attaches it to a GitHub Release — no more APKs
# committed to the repo by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/debug/app-debug.apk "Picasso-${GITHUB_REF_NAME}.apk"

      # Play Store artifact. Only runs once the upload-key secrets below exist
      # in the repo settings (see README "Play Store release signing").
      # Without them the step is skipped and the GitHub Release still ships.
      - name: Restore upload keystore
        if: ${{ secrets.PICASSO_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.PICASSO_KEYSTORE_BASE64 }}" | base64 -d > /tmp/picasso-upload.jks

      - name: Build signed release bundle
        if: ${{ secrets.PICASSO_KEYSTORE_BASE64 != '' }}
        env:
          PICASSO_KEYSTORE_FILE: /tmp/picasso-upload.jks
          PICASSO_KEYSTORE_PASSWORD: ${{ secrets.PICASSO_KEYSTORE_PASSWORD }}
          PICASSO_KEY_ALIAS: ${{ secrets.PICASSO_KEY_ALIAS }}
          PICASSO_KEY_PASSWORD: ${{ secrets.PICASSO_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release bundle for Play Console
        if: ${{ secrets.PICASSO_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Picasso-${{ github.ref_name }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Picasso-${{ github.ref_name }}.apk
          generate_release_notes: true
